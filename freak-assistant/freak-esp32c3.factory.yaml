---
packages:
  va_connected_wait_for_ble:
    voice_assistant:
      on_client_connected:
        - wait_until: # 等待直到蓝牙（BLE）被禁用
            not: ble.enabled
  # 引入主配置文件，该文件包含了freak-esp32c3设备的完整配置
  freak-esp32c3: !include freak-esp32c3.yaml

esphome:
  project:
    name: esphome.voice-assistant # 项目名称
    version: dev # 版本号

ota:
  - platform: esphome


wifi:
  # 当 WiFi 连接成功后执行
  on_connect:
    - delay: 5s
    - ble.disable:
  # 当 WiFi 断开时执行
  on_disconnect:
    - ble.enable:

improv_serial: # Improv 串行配置

esp32_improv:
  authorizer: none # 禁用授权
